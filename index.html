<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LAST SECRET – Secrets Never Stay Buried</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       DESIGN TOKENS & ATMOSPHERIC THEME
       ========================================================================= */
    :root {
      --bg-navy: #070b14;
      --bg-charcoal: #0d1322;
      --bg-panel: #11192c;
      --bg-panel-elevated: #172139;
      --burgundy-dark: #3b0d1b;
      --burgundy: #5c162b;
      --burgundy-bright: #852140;
      --gold: #d4af37;
      --gold-light: #f3d27a;
      --gold-dim: rgba(212, 175, 55, 0.25);
      --text-main: #eef2f8;
      --text-muted: #9aa7be;
      --text-dim: #69768e;
      --border-subtle: rgba(212, 175, 55, 0.22);
      --border-strong: rgba(212, 175, 55, 0.55);
      --success: #2ea073;
      --warning: #d99b26;
      --danger: #c93b4b;
      --font-display: 'Cinzel', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.55);
      --shadow-glow: 0 0 24px rgba(212, 175, 55, 0.22);
      --transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-navy);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, h4, .font-display {
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }

    button {
      font-family: var(--font-sans);
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      transition: var(--transition);
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-navy);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.55);
    }

    /* =========================================================================
       ATMOSPHERIC BACKGROUND CANVAS & VIGNETTE
       ========================================================================= */
    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 25%, rgba(92, 22, 43, 0.14), transparent 60%),
        radial-gradient(circle at 50% 50%, transparent 45%, rgba(3, 5, 10, 0.85) 100%);
    }

    #app-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================================
       TOP NAVIGATION / PERSISTENT HUD
       ========================================================================= */
    .top-hud {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.65rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hud-title-group {
      display: flex;
      flex-direction: column;
    }

    .hud-brand-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1.15;
    }

    .hud-level-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hud-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    .stat-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 0.32rem 0.75rem;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-main);
    }

    .stat-pill strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    .hud-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-hud {
      background: var(--bg-panel-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.42rem 0.72rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      position: relative;
    }

    .btn-hud:hover {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
      transform: translateY(-1px);
    }

    .btn-hud.active-tab {
      border-color: var(--gold-light);
      background: rgba(133, 33, 64, 0.38);
      color: var(--gold-light);
    }

    .badge-count {
      background: var(--burgundy-bright);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.05rem 0.38rem;
      border-radius: 999px;
    }

    /* =========================================================================
       BUTTONS & CARDS
       ========================================================================= */
    .btn-primary {
      background: linear-gradient(135deg, var(--burgundy-bright), var(--burgundy));
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.78rem 1.5rem;
      border-radius: var(--radius-md);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45), 0 0 16px rgba(212, 175, 55, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6), 0 0 24px rgba(212, 175, 55, 0.32);
      background: linear-gradient(135deg, #9d274c, var(--burgundy-bright));
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #141006;
      font-weight: 700;
      padding: 0.68rem 1.25rem;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }

    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .btn-gold:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-panel-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-weight: 500;
      padding: 0.62rem 1.1rem;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .panel-card {
      background: linear-gradient(180deg, rgba(17, 25, 44, 0.94), rgba(11, 17, 31, 0.96));
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    /* =========================================================================
       TITLE / LANDING SCREEN
       ========================================================================= */
    .title-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3.5rem;
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
      animation: fadeInUp 0.65s ease;
    }

    .crest-hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .crest-kicker {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(133, 33, 64, 0.26);
      border: 1px solid var(--border-subtle);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 0.9rem;
    }

    .main-game-title {
      font-size: clamp(2.1rem, 5.5vw, 3.8rem);
      font-weight: 800;
      color: var(--gold-light);
      text-shadow: 0 4px 28px rgba(212, 175, 55, 0.25), 0 2px 6px rgba(0, 0, 0, 0.9);
      line-height: 1.12;
    }

    .main-game-subtitle {
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 2.2vw, 1.3rem);
      color: #e6b8c6;
      margin-top: 0.45rem;
      letter-spacing: 0.12em;
    }

    .premise-box {
      max-width: 780px;
      margin: 1.25rem auto 0;
      background: rgba(13, 19, 34, 0.85);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--gold);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.35rem;
      text-align: left;
      color: var(--text-main);
      font-size: 0.96rem;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.25rem;
      width: 100%;
      margin-bottom: 1.75rem;
    }

    .difficulty-option {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
    }

    .difficulty-option.selected {
      border-color: var(--gold-light);
      background: rgba(133, 33, 64, 0.28);
      box-shadow: var(--shadow-glow);
    }

    .difficulty-name {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--gold-light);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .difficulty-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .cast-strip {
      width: 100%;
      margin-top: 1.5rem;
    }

    .cast-strip-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .cast-grid-8 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 0.75rem;
    }

    .cast-mini-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.6rem;
      text-align: center;
      transition: var(--transition);
    }

    .cast-mini-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .cast-mini-name {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text-main);
      margin-top: 0.35rem;
    }

    .cast-mini-role {
      font-size: 0.7rem;
      color: var(--gold);
    }

    /* =========================================================================
       MAIN INVESTIGATION WORKSPACE
       ========================================================================= */
    .game-workspace {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .chapter-banner {
      background: linear-gradient(90deg, rgba(92, 22, 43, 0.55), rgba(17, 25, 44, 0.95) 45%, rgba(17, 25, 44, 0.95));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 1.15rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      animation: fadeInUp 0.4s ease;
    }

    .chapter-kicker {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold);
      font-weight: 600;
    }

    .chapter-heading {
      font-size: clamp(1.3rem, 2.8vw, 1.9rem);
      color: var(--gold-light);
      margin-top: 0.15rem;
    }

    .chapter-objective {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .level-step-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .step-pill {
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    .step-pill.active {
      background: var(--gold);
      color: #141006;
      border-color: var(--gold-light);
    }

    .step-pill.completed {
      border-color: var(--success);
      color: #7ee2b8;
    }

    /* =========================================================================
       CRIME SCENE EXPLORER (LEVEL 1)
       ========================================================================= */
    .scene-container {
      position: relative;
      width: 100%;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      background: #080d18;
      box-shadow: var(--shadow-card);
      user-select: none;
      touch-action: none;
    }

    .scene-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 300px;
      overflow: hidden;
    }

    .scene-zoom-layer {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.25s ease-out;
    }

    .scene-zoom-layer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hotspot-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.22);
      border: 2px solid var(--gold-light);
      box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.65);
      animation: hotspotPulse 2.2s infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
    }

    .hotspot-btn:hover {
      background: rgba(133, 33, 64, 0.75);
      transform: translate(-50%, -50%) scale(1.12);
    }

    .hotspot-btn.inspected {
      border-color: #4ade80;
      background: rgba(46, 160, 115, 0.28);
      animation: none;
    }

    .hotspot-core {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold-light);
    }

    .hotspot-btn.inspected .hotspot-core {
      background: #4ade80;
    }

    .hotspot-tag {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 11, 20, 0.92);
      border: 1px solid var(--border-subtle);
      color: var(--gold-light);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.14rem 0.5rem;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .scene-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
    }

    /* =========================================================================
       CHARACTER GRID & DIALOGUE SYSTEM
       ========================================================================= */
    .suspects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.9rem;
    }

    .suspect-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      text-align: left;
      transition: var(--transition);
    }

    .suspect-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .suspect-card.selected {
      border-color: var(--gold-light);
      background: rgba(133, 33, 64, 0.25);
      box-shadow: var(--shadow-glow);
    }

    .suspect-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .portrait-frame {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: radial-gradient(circle at 35% 25%, #233252, #0b101d);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portrait-frame.large {
      width: 112px;
      height: 112px;
      border-width: 3px;
    }

    .dialogue-box {
      background: linear-gradient(180deg, rgba(16, 24, 43, 0.98), rgba(9, 14, 26, 0.99));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .dialogue-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .dialogue-speech {
      background: rgba(7, 11, 20, 0.75);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius-sm);
      padding: 0.95rem 1.1rem;
      font-size: 0.98rem;
      min-height: 76px;
      color: var(--text-main);
    }

    .dialogue-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .choice-btn {
      background: var(--bg-panel-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.58rem 0.9rem;
      font-size: 0.84rem;
      text-align: left;
      color: var(--gold-light);
    }

    .choice-btn:hover {
      border-color: var(--gold-light);
      background: rgba(133, 33, 64, 0.34);
    }

    /* =========================================================================
       INTERACTIVE FLOOR MAP & TIMELINE
       ========================================================================= */
    .floor-map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.85rem;
    }

    .room-zone {
      background: rgba(12, 19, 34, 0.9);
      border: 1px dashed rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
    }

    .room-zone.drag-over {
      border-style: solid;
      border-color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
    }

    .room-title {
      font-family: var(--font-display);
      font-size: 0.86rem;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
    }

    .room-time {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .placed-token {
      background: var(--bg-panel-elevated);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 0.24rem 0.65rem;
      font-size: 0.76rem;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0.2rem;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .timeline-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.8rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .timeline-item[draggable="true"] {
      cursor: grab;
    }

    .timeline-item.dragging {
      opacity: 0.5;
      border-color: var(--gold-light);
    }

    /* =========================================================================
       DRAWERS & MODALS (EVIDENCE, DETECTIVE BOARD, NOTEBOOK, HINTS)
       ========================================================================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.76);
      backdrop-filter: blur(6px);
      z-index: 60;
      display: flex;
      justify-content: flex-end;
    }

    .drawer-panel {
      width: min(680px, 100vw);
      height: 100vh;
      background: var(--bg-charcoal);
      border-left: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideInRight 0.28s ease;
    }

    .drawer-panel.wide {
      width: min(980px, 100vw);
    }

    .drawer-header {
      padding: 1rem 1.25rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.82);
      backdrop-filter: blur(6px);
      z-index: 75;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      max-width: 640px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.35rem;
      box-shadow: var(--shadow-card);
      animation: fadeInUp 0.25s ease;
    }

    /* Living Detective Board */
    .board-canvas-wrap {
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05), transparent 70%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 28px),
        #090e1a;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 1rem;
      min-height: 430px;
      overflow: hidden;
    }

    .board-strings-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .board-columns {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .board-node {
      background: var(--bg-panel-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.55rem;
      cursor: pointer;
      font-size: 0.82rem;
      transition: var(--transition);
    }

    .board-node:hover {
      border-color: var(--gold);
    }

    .board-node.link-source {
      border-color: var(--gold-light);
      box-shadow: 0 0 14px rgba(243, 210, 122, 0.45);
      background: rgba(133, 33, 64, 0.35);
    }

    /* Toast / Feedback Banner */
    .toast-banner {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: linear-gradient(135deg, var(--bg-panel-elevated), #1d1222);
      border: 1px solid var(--gold);
      color: var(--text-main);
      padding: 0.7rem 1.2rem;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      font-size: 0.88rem;
      max-width: min(92vw, 560px);
      text-align: center;
      animation: fadeInUp 0.25s ease;
    }

    /* Certificate Print Styling */
    .certificate-box {
      background: linear-gradient(160deg, #141d33, #0c1220);
      border: 3px double var(--gold);
      border-radius: var(--radius-lg);
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .printable-cert, .printable-cert * {
        visibility: visible;
      }
      .printable-cert {
        position: fixed;
        inset: 0;
        background: #fff !important;
        color: #111 !important;
        padding: 2rem;
      }
    }

    /* =========================================================================
       ANIMATIONS
       ========================================================================= */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes hotspotPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(243, 210, 122, 0.65);
      }
      70% {
        box-shadow: 0 0 0 14px rgba(243, 210, 122, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(243, 210, 122, 0);
      }
    }

    @media (max-width: 640px) {
      .top-hud {
        padding: 0.55rem 0.75rem;
      }
      .game-workspace {
        padding: 0.8rem;
      }
      .scene-viewport {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>

        droneGain.connect(masterGain);
        osc1.start();
        osc2.start();

        // Gentle filtered noise for hill-station rain
        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = output[i];
          output[i] *= 1.6;
        }
        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const rainFilter = ctx.createBiquadFilter();
        rainFilter.type = "bandpass";
        rainFilter.frequency.value = 950;
        rainFilter.Q.value = 0.65;

        rainGain = ctx.createGain();
        rainGain.gain.value = state.settings.ambienceEnabled ? 0.08 : 0;

        whiteNoise.connect(rainFilter);
        rainFilter.connect(rainGain);
        rainGain.connect(masterGain);
        whiteNoise.start();

        initialized = true;
      }

      function unlockAndSync() {
        ensureContext();
        if (ctx && ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
        syncSettings();
      }

      function syncSettings() {
        if (!ctx || !masterGain) return;
        masterGain.gain.setTargetAtTime(
          state.settings.muted ? 0 : state.settings.volume,
          ctx.currentTime,
          0.05
        );
        if (droneGain) {
          droneGain.gain.setTargetAtTime(
            state.settings.musicEnabled ? 0.09 : 0,
            ctx.currentTime,
            0.15
          );
        }
        if (rainGain) {
          rainGain.gain.setTargetAtTime(
            state.settings.ambienceEnabled ? 0.08 : 0,
            ctx.currentTime,
            0.15
          );
        }
      }

      function playTone(freq, duration, type = "sine", peak = 0.14, delay = 0) {
        if (!ctx || !masterGain || state.settings.muted) return;
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(peak, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      return {
        unlockAndSync,
        syncSettings,
        chime() {
          unlockAndSync();
          playTone(587.33, 0.25, "sine", 0.12, 0);
          playTone(880, 0.35, "sine", 0.1, 0.09);
        },
        pageTurn() {
          unlockAndSync();
          playTone(220, 0.09, "triangle", 0.08, 0);
          playTone(310, 0.08, "sine", 0.06, 0.04);
        },
        footstep() {
          unlockAndSync();
          playTone(110, 0.08, "sine", 0.14, 0);
        },
        doorCreak() {
          unlockAndSync();
          playTone(145, 0.32, "sawtooth", 0.05, 0);
          playTone(122, 0.35, "triangle", 0.06, 0.12);
        },
        thunder() {
          unlockAndSync();
          playTone(55, 0.85, "sawtooth", 0.11, 0);
          playTone(42, 1.1, "sine", 0.15, 0.15);
        },
        dramaSwell() {
          unlockAndSync();
          playTone(196, 0.7, "sawtooth", 0.08, 0);
          playTone(233.08, 0.7, "triangle", 0.08, 0.08);
          playTone(293.66, 0.9, "sine", 0.1, 0.16);
        }
      };
    })();

    /* =======================================================================
       3. CANVAS RAIN & MIST PARTICLE SYSTEM
       ======================================================================= */
    (() => {
      const canvas = document.getElementById("atmosphere-canvas");
      const c = canvas.getContext("2d");
      let drops = [];
      let mistPuffs = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.min(130, Math.floor((canvas.width * canvas.height) / 14000));
        drops = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: 10 + Math.random() * 14,
          speed: 6 + Math.random() * 7,
          drift: -1.6 - Math.random() * 1.2,
          alpha: 0.12 + Math.random() * 0.22
        }));
        mistPuffs = Array.from({ length: 8 }, (_, i) => ({
          x: (i / 8) * canvas.width,
          y: canvas.height * (0.2 + (i % 4) * 0.2),
          r: 140 + Math.random() * 120,
          vx: 0.18 + Math.random() * 0.25,
          alpha: 0.025 + Math.random() * 0.025
        }));
      }

      function tick() {
        c.clearRect(0, 0, canvas.width, canvas.height);

        // Mist layers
        for (const m of mistPuffs) {
          m.x += m.vx;
          if (m.x - m.r > canvas.width) m.x = -m.r;
          const grad = c.createRadialGradient(m.x, m.y, 10, m.x, m.y, m.r);
          grad.addColorStop(0, `rgba(180, 200, 230, ${m.alpha})`);
          grad.addColorStop(1, "rgba(180, 200, 230, 0)");
          c.fillStyle = grad;
          c.beginPath();
          c.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          c.fill();
        }

        // Rain streaks
        c.lineWidth = 1;
        for (const d of drops) {
          c.strokeStyle = `rgba(186, 210, 245, ${d.alpha})`;
          c.beginPath();
          c.moveTo(d.x, d.y);
          c.lineTo(d.x + d.drift * 2.2, d.y + d.len);
          c.stroke();

          d.x += d.drift;
          d.y += d.speed;
          if (d.y > canvas.height || d.x < -40) {
            d.x = Math.random() * (canvas.width + 120);
            d.y = -20;
          }
        }

        requestAnimationFrame(tick);
      }

      window.addEventListener("resize", resize);
      resize();
      tick();
    })();

    let state = loadSavedState() || createInitialState();

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return { ...createInitialState(), ...parsed, settings: { ...createInitialState().settings, ...(parsed.settings || {}) } };
      } catch (e) {
        return null;
      }
    }

    function saveGame(silent = false) {
      try {
        state.lastSavedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (!silent) showToast("Progress saved to browser storage.");
      } catch (e) {
        if (!silent) showToast("Could not save progress (storage unavailable).");
      }
    }

    function resetGame() {
      localStorage.removeItem(STORAGE_KEY);
      state = createInitialState();
      renderApp();
      showToast("Started a fresh mystery investigation.");
    }

    function addEvidence(id) {
      if (!state.evidenceIds.includes(id)) {
        state.evidenceIds.push(id);
        state.score += 25;
        const ev = EVIDENCE_CATALOG.find(e => e.id === id);
        if (ev) {
          addNotebookFact(`Clue logged: ${ev.title} — ${ev.summary}`);
        }
        SoundEngine.chime();
        saveGame(true);
      }
    }

    function addNotebookFact(fact) {
      if (!state.notebookFacts.includes(fact)) {
        state.notebookFacts.unshift(fact);
      }
    }

    function getCharMem(id) {
      if (!state.characterMemory[id]) {
        state.characterMemory[id] = {
          talkedCount: 0,
          pressed: false,
          accusedEarly: false,
          flaggedSuspicious: false
        };
      }
      return state.characterMemory[id];
    }

    function showToast(msg) {
      const container = document.getElementById("toast-container");
      container.innerHTML = `<div class="toast-banner" role="status">${escapeHtml(msg)}</div>`;
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        container.innerHTML = "";
      }, 3600);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function bindDrawerInteractions(tab) {
      if (tab === "evidence") {
        document.querySelectorAll("[data-ev-filter]").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-ev-filter]").forEach(b => b.classList.remove("active-tab"));
            btn.classList.add("active-tab");
            const cat = btn.dataset.evFilter;
            document.querySelectorAll(".ev-card-item").forEach(card => {
              card.style.display = (cat === "All" || card.dataset.cat === cat) ? "" : "none";
            });
          });
        });
      }

      if (tab === "board") {
        let firstSelected = null;
        drawBoardStrings();

        document.querySelectorAll(".board-node").forEach(node => {
          node.addEventListener("click", () => {
            SoundEngine.pageTurn();
            if (!firstSelected) {
              firstSelected = node;
              node.classList.add("link-source");
              showToast(`Selected "${node.dataset.nodeLabel}". Click another card to connect.`);
              return;
            }
            if (firstSelected === node) {
              node.classList.remove("link-source");
              firstSelected = null;
              return;
            }
            const a = { id: firstSelected.dataset.nodeId, type: firstSelected.dataset.nodeType, label: firstSelected.dataset.nodeLabel };
            const b = { id: node.dataset.nodeId, type: node.dataset.nodeType, label: node.dataset.nodeLabel };
            firstSelected.classList.remove("link-source");
            firstSelected = null;

            const exists = state.boardConnections.some(c => (c.aId === a.id && c.bId === b.id) || (c.aId === b.id && c.bId === a.id));
            if (exists) {
              showToast("Those two cards are already connected on the board.");
              return;
            }

            const analysis = evaluateBoardLink(a, b);
            state.boardConnections.push({
              aId: a.id,
              bId: b.id,
              aLabel: a.label,
              bLabel: b.label,
              note: analysis.note
            });
            if (analysis.isStrong) {
              state.score += 20;
            }
            saveGame(true);
            showToast(analysis.question);
            openDrawer("board");
          });
        });

        document.querySelectorAll("[data-remove-link]").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.removeLink);
            state.boardConnections.splice(idx, 1);
            saveGame(true);
            openDrawer("board");
          });
        });
      }

      if (tab === "notebook") {
        document.querySelectorAll("[data-jump-level]").forEach(btn => {
          btn.addEventListener("click", () => {
            const targetLv = Number(btn.dataset.jumpLevel);
            state.level = targetLv;
            saveGame(true);
            closeOverlay();
            renderApp();
            showToast(`Opened Level ${targetLv}: ${LEVEL_META[targetLv - 1].title}`);
          });
        });
      }
    }

    function evaluateBoardLink(a, b) {
      const pair = [a.id, b.id].sort().join("|");
      if (pair.includes("sus_tara") && (pair.includes("m_scholarship") || pair.includes("ev_cctv_sync") || pair.includes("ev_scholarship_memo") || pair.includes("ev_clue_curation_log"))) {
        return {
          isStrong: true,
          note: "Strong lead — ties Tara to audit/clock manipulation",
          question: "Sharp connection: How does Tara's server/clock access connect to the scholarship audit files?"
        };
      }
      if (pair.includes("sus_riya") && pair.includes("m_mural")) {
        return {
          isStrong: false,
          note: "Red herring check — argument vs. murder method",
          question: "Question to ask: Riya argued about a mural—does a loud argument explain a +35-minute clock-sync edit?"
        };
      }
      if (pair.includes("sus_meera") && pair.includes("m_herbs")) {
        return {
          isStrong: false,
          note: "Botany lead — check timing & alibi",
          question: "Question to ask: Meera studied herbs in the glasshouse, but who altered the library clock log?"
        };
      }
      if (pair.includes("sus_nandini") && pair.includes("ev_doctored_photo")) {
        return {
          isStrong: true,
          note: "False-trail check — photo altered to frame Nandini",
          question: "Question to ask: If the cloister photo was edited, who wanted Nandini to look guilty?"
        };
      }
      return {
        isStrong: false,
        note: "Exploratory thread",
        question: `Investigative question: What links "${a.label}" to "${b.label}" in the dawn timeline?`
      };
    }

    function drawBoardStrings() {
      const svg = document.getElementById("board-svg-lines");
      const wrap = document.getElementById("living-board-area");
      if (!svg || !wrap) return;
      const wrapRect = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${Math.max(100, wrapRect.width)} ${Math.max(100, wrapRect.height)}`);
      let lines = "";
      for (const conn of state.boardConnections) {
        const elA = wrap.querySelector(`[data-node-id="${CSS.escape(conn.aId)}"]`);
        const elB = wrap.querySelector(`[data-node-id="${CSS.escape(conn.bId)}"]`);
        if (!elA || !elB) continue;
        const rA = elA.getBoundingClientRect();
        const rB = elB.getBoundingClientRect();
        const x1 = rA.left - wrapRect.left + rA.width / 2;
        const y1 = rA.top - wrapRect.top + rA.height / 2;
        const x2 = rB.left - wrapRect.left + rB.width / 2;
        const y2 = rB.top - wrapRect.top + rB.height / 2;
        lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="5,3" opacity="0.82"/>`;
        lines += `<circle cx="${x1}" cy="${y1}" r="4" fill="#f3d27a"/>`;
        lines += `<circle cx="${x2}" cy="${y2}" r="4" fill="#f3d27a"/>`;
      }
      svg.innerHTML = lines;
    }

      SoundEngine.chime();
      const diff = STORY_BIBLE.difficulties[state.difficulty] || STORY_BIBLE.difficulties.investigator;
      const hintByLevel = {
        1: "Inspect all five highlighted spots in the Old Library—especially the stopped clock (05:42), tea cup, and torn audit slip—then choose three suspicious details.",
        2: "Check everyone's dawn location on the academy map. Pay close attention to Riya's hesitant corridor pass and Tara's 35-minute AV/Server Room gap.",
        3: "Locate Ms. Eleanor's concealed diary first. The cipher shifts letters by 3 steps (e.g., S→P, T→Q)—look for words about a 'PORTAL BREACH' and 'SCHOLARSHIP LEDGER'.",
        4: "Start with what happened before the fall (tea prepared, clock-sync edit), then the fall (~05:45 AM), corridor pass & frame removal, and finally discovery at ~06:20 AM.",
        5: "Compare photo/message details against timestamps and Nandini's family-letter secret. Doctored imagery and planted finger-pointing messages are false trails.",
        6: "Look at who had both tech access to shift the clock log and a stake in keeping scholarship/endowment audit files quiet.",
        7: "Don't forget the twist within the twist: Tara helped steer early attention toward red herrings. Build your proof chain using Tara's motive, AV/clock opportunity, alibi contradiction, and physical/digital proof.",
        8: "Step through the confrontation to review the complete chain of events, motive, method, red herrings, and epilogues, then view your Detective Certificate."
      };

      const penalty = state.difficulty === "detective" ? 0 : (diff.hintPenalty || 25);
      if (penalty > 0 && state.hintsUsed > 0) {
        state.score = Math.max(0, state.score - penalty);
      }
      state.hintsUsed += 1;
      saveGame(true);

      const overlay = document.getElementById("overlay-container");
      overlay.innerHTML = `
        <div class="modal-backdrop" id="hint-backdrop" role="dialog" aria-modal="true">

    function bindHudListeners() {
      document.getElementById("hud-home-btn").addEventListener("click", () => {
        saveGame(true);
        state.started = false;
        renderApp();
      });
      document.getElementById("open-evidence-btn").addEventListener("click", () => openDrawer("evidence"));
      document.getElementById("open-board-btn").addEventListener("click", () => openDrawer("board"));
      document.getElementById("open-timeline-btn").addEventListener("click", () => openDrawer("timeline"));
      document.getElementById("open-notebook-btn").addEventListener("click", () => openDrawer("notebook"));
      document.getElementById("open-hint-btn").addEventListener("click", openHintModal);
      document.getElementById("hud-save-btn").addEventListener("click", () => saveGame(false));
      document.getElementById("open-settings-btn").addEventListener("click", openSettingsModal);

      document.querySelectorAll("[data-top-level]").forEach(btn => {
        btn.addEventListener("click", () => {
          const lv = Number(btn.dataset.top-level || btn.dataset.topLevel);
          state.level = lv;
          saveGame(true);
          SoundEngine.pageTurn();
          renderApp();
        });
      });
    }

    function completeLevelAndAdvance(lvNum, bonusPoints, unlockNote) {
      if (!state.completedLevels.includes(lvNum)) {
        state.completedLevels.push(lvNum);
        state.score += bonusPoints;
      }
      addNotebookFact(unlockNote);
      if (lvNum < 8 && state.level < lvNum + 1) {
        state.level = lvNum + 1;
      } else if (lvNum < 8) {
        state.level = lvNum + 1;
      }
      saveGame(true);
      SoundEngine.chime();
      renderApp();
      showToast(`Level ${lvNum} complete! Unlocked: ${unlockNote}`);
    }

    function bindLevel1() {
      let zoom = 1;
      const zoomLayer = document.getElementById("l1-zoom-layer");
      const applyZoom = () => {
        if (zoomLayer) zoomLayer.style.transform = `scale(${zoom})`;
      };

      document.getElementById("l1-zoom-in")?.addEventListener("click", () => {
        zoom = Math.min(1.45, Number((zoom + 0.15).toFixed(2)));
        applyZoom();
      });
      document.getElementById("l1-zoom-out")?.addEventListener("click", () => {
        zoom = Math.max(1, Number((zoom - 0.15).toFixed(2)));
        applyZoom();
      });
      document.getElementById("l1-zoom-reset")?.addEventListener("click", () => {
        zoom = 1;
        applyZoom();
      });

      document.querySelectorAll("[data-hotspot]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.hotspot;
          renderLevel1._inspectId = id;
          if (!state.l1.inspected.includes(id)) {
            state.l1.inspected.push(id);
            addEvidence(id);
          } else {
            SoundEngine.pageTurn();
          }
          renderApp();
        });
      });

      document.querySelectorAll("[data-l1-talk]").forEach(btn => {
        btn.addEventListener("click", () => {
          const cid = btn.dataset.l1Talk;
          if (!state.l1.talked.includes(cid)) {
            state.l1.talked.push(cid);
            state.score += 10;
          }
          const mem = getCharMem(cid);
          mem.talkedCount += 1;
          const ch = CHARACTERS.find(c => c.id === cid);
          SoundEngine.pageTurn();
          saveGame(true);
          showToast(`${ch.name}: "${ch.introLine}"`);
          renderApp();
        });
      });

      document.querySelectorAll("[data-l1-choice]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.l1Choice;
          const arr = state.l1.selectedSuspects;
          if (arr.includes(id)) {
            state.l1.selectedSuspects = arr.filter(x => x !== id);
          } else if (arr.length < 3) {
            arr.push(id);
          } else {
            showToast("Select up to 3 suspicious details (click one to unselect).");
            return;
          }
          SoundEngine.pageTurn();
          renderApp();
        });
      });

      document.getElementById("l1-submit-btn")?.addEventListener("click", () => {
        const sel = state.l1.selectedSuspects;
        const ok = ["s1", "s2", "s3"].every(x => sel.includes(x));
        if (ok) {
          completeLevelAndAdvance(1, 100, "Crime Scene Investigation Board (bitter tea, stopped clock, audit slip & missing photo)");
        } else {
          state.wrongAccusations += 1;
          state.score = Math.max(0, state.score - 20);
          showToast("One of those choices isn't a suspicious crime-scene detail. Check the tea cup, stopped clock, audit slip, and missing photo.");
          renderHudStatsOnly();
        }
      });
    }

        { id: "c_aarohi", label: "Aarohi Verma — Checked East Hall stage cues from 05:25–06:05 AM" }
      ];

      return `
        <div style="display:flex;flex-direction:column;gap:1.25rem;">

                  <div style="font-size:0.8rem;color:var(--gold);margin-bottom:0.35rem;">${escapeHtml(activeChar.archetype)} • Alibi: ${escapeHtml(activeChar.alibi)}</div>

    function bindLevel2() {
      document.querySelectorAll("[data-l2-select-char]").forEach(btn => {
        btn.addEventListener("click", () => {
          renderLevel2._activeChar = btn.dataset.l2SelectChar;
          SoundEngine.pageTurn();
          renderApp();
        });
      });

      const activeId = renderLevel2._activeChar || "tara";
      document.getElementById("l2-press-btn")?.addEventListener("click", () => {
        const mem = getCharMem(activeId);
        mem.pressed = true;
        mem.talkedCount += 1;
        state.score += 10;
        SoundEngine.pageTurn();
        saveGame(true);
        renderApp();
      });

      document.getElementById("l2-flag-sus-btn")?.addEventListener("click", () => {
        const mem = getCharMem(activeId);
        mem.accusedEarly = true;
        const ch = CHARACTERS.find(c => c.id === activeId);
        addNotebookFact(`Pressed/flagged ${ch.name} during alibi check—she will remember this in later conversations.`);
        SoundEngine.chime();
        saveGame(true);
        showToast(`Noted suspicion toward ${ch.name}. She will remember your questioning.`);
        renderApp();
      });

      let draggedChar = null;
      document.querySelectorAll("[data-drag-char]").forEach(tok => {
        tok.addEventListener("dragstart", e => {
          draggedChar = tok.dataset.dragChar;
          if (e.dataTransfer) e.dataTransfer.setData("text/plain", draggedChar);
        });
        tok.addEventListener("click", e => {
          e.stopPropagation();
          draggedChar = tok.dataset.dragChar;
          showToast(`Selected ${draggedChar}. Tap a room card to move.`);
        });
      });

      document.querySelectorAll("[data-drop-room]").forEach(zone => {
        zone.addEventListener("dragover", e => {
          e.preventDefault();
          zone.classList.add("drag-over");
        });
        zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
        zone.addEventListener("drop", e => {
          e.preventDefault();
          zone.classList.remove("drag-over");
          const cid = draggedChar || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
          if (cid) {
            state.l2.placements[cid] = zone.dataset.dropRoom;
            SoundEngine.footstep();
            saveGame(true);
            renderApp();
          }
        });
        zone.addEventListener("click", () => {
          if (draggedChar) {
            state.l2.placements[draggedChar] = zone.dataset.dropRoom;
            draggedChar = null;
            SoundEngine.footstep();
            saveGame(true);
            renderApp();
          }
        });
      });

      document.querySelectorAll("[data-l2-contra]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.l2Contra;
          const arr = state.l2.selectedAlibiContradictions;
          if (arr.includes(id)) {
            state.l2.selectedAlibiContradictions = arr.filter(x => x !== id);
          } else if (arr.length < 2) {
            arr.push(id);
          } else {
            showToast("Choose 2 alibis (click one to swap).");
            return;
          }
          SoundEngine.pageTurn();
          renderApp();
        });
      });

      document.getElementById("l2-submit-btn")?.addEventListener("click", () => {
        const sel = state.l2.selectedAlibiContradictions;
        if (sel.includes("c_tara") && sel.includes("c_riya")) {
          addEvidence("ev_alibi_map_report");
          completeLevelAndAdvance(2, 110, "Suspect Timeline (Tara's AV room gap & Riya's corridor pass mapped)");
        } else {
          state.wrongAccusations += 1;
          state.score = Math.max(0, state.score - 20);
          showToast("Look closer at who had an unexplained gap/edit and who held back walking past the library corridor.");
          renderHudStatsOnly();
        }
      });
    }

    /* =======================================================================
       LEVEL 3 – SECRETS IN THE DIARY
       ======================================================================= */
    function caesarShift(text, shift) {
      return text.replace(/[A-Z]/g, ch => {
        const code = ch.charCodeAt(0) - 65;
        return String.fromCharCode(((code + shift + 26) % 26) + 65);
      });
    }

        renderHudStatsOnly();
      });

      const swapItems = (a, b) => {
        if (a < 0 || b < 0 || a >= state.l4.events.length || b >= state.l4.events.length) return;
        const copy = [...state.l4.events];
        const temp = copy[a];
        copy[a] = copy[b];
        copy[b] = temp;
        state.l4.events = copy;
        SoundEngine.pageTurn();
        saveGame(true);
        renderApp();
      };

      document.querySelectorAll("[data-move-up]").forEach(btn => {
        btn.addEventListener("click", () => swapItems(Number(btn.dataset.moveUp), Number(btn.dataset.moveUp) - 1));
      });
      document.querySelectorAll("[data-move-down]").forEach(btn => {
        btn.addEventListener("click", () => swapItems(Number(btn.dataset.moveDown), Number(btn.dataset.moveDown) + 1));
      });

      let dragSrc = null;
      document.querySelectorAll("[data-l4-idx]").forEach(row => {
        row.addEventListener("dragstart", () => {
          dragSrc = Number(row.dataset.l4Idx);
          row.classList.add("dragging");
        });
        row.addEventListener("dragend", () => row.classList.remove("dragging"));
        row.addEventListener("dragover", e => e.preventDefault());
        row.addEventListener("drop", () => {
          const targetIdx = Number(row.dataset.l4Idx);
          if (dragSrc !== null && dragSrc !== targetIdx) {
            swapItems(dragSrc, targetIdx);
          }
          dragSrc = null;
        });
      });

      document.getElementById("l4-submit-btn")?.addEventListener("click", () => {
        const currentIds = state.l4.events.map(e => e.id);

          renderHudStatsOnly();
        }
      });
    }

                <select id="l7-clue" style="width:100%;padding:0.55rem;border-radius:var(--radius-sm);background:var(--bg-navy);color:var(--text-main);border:1px solid var(--border-subtle);">
                  <option value="">-- Choose Clue --</option>
                  <option value="audit_and_sync_logs" ${proof.clue === "audit_and_sync_logs" ? "selected" : ""}>Torn Audit Slip + Decoded Cipher + Server Clock-Sync Log</option>
                  <option value="doctored_photo_only" ${proof.clue === "doctored_photo_only" ? "selected" : ""}>Doctored photo framing Nandini</option>
                </select>
              </div>
            </div>

            <h4 style="color:var(--gold-light);font-size:0.95rem;margin:1.1rem 0 0.55rem;">Select the Suspect You Are Accusing</h4>
            <div class="suspects-grid" style="margin-bottom:1rem;">
              ${CHARACTERS.map(c => `
                <button class="suspect-card ${state.l7.accusedSuspectId === c.id ? "selected" : ""}" data-l7-accuse="${c.id}">
                  <div class="suspect-header">
                    ${renderPortraitSVG(c.id)}
                    <div>
                      <div style="font-weight:700;font-size:0.86rem;color:var(--gold-light);">${escapeHtml(c.name)}</div>
                      <div style="font-size:0.72rem;color:var(--text-muted);">${escapeHtml(c.archetype)}</div>
                    </div>
                  </div>
                </button>
              `).join("")}
            </div>

            ${state.l7.feedbackMsg ? `
              <div style="padding:0.8rem 1rem;border-radius:var(--radius-sm);background:rgba(201,59,75,0.18);border:1px solid var(--danger);color:#fecaca;font-size:0.88rem;margin-bottom:0.9rem;">
                ${escapeHtml(state.l7.feedbackMsg)}
              </div>
            ` : ""}

            <button class="btn-primary" id="l7-submit-accusation" ${readyToAccuse && state.l7.accusedSuspectId ? "" : "disabled"}>
              Present Proof & Confront Suspect →
            </button>
          </div>
        </div>
      `;
    }

    function bindLevel7() {
      document.getElementById("l7-reveal-twist-btn")?.addEventListener("click", () => {
        state.l7.twistRevealed = true;
        addEvidence("ev_clue_curation_log");
        SoundEngine.dramaSwell();
        saveGame(true);
        showToast("Twist within the twist uncovered: Tara curated clue pacing to keep red herrings active.");
        renderApp();
      });

      ["l7-motive", "l7-opportunity", "l7-contradiction", "l7-clue"].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("change", () => {
            state.l7.proofChain.motive = document.getElementById("l7-motive").value;
            state.l7.proofChain.opportunity = document.getElementById("l7-opportunity").value;
            state.l7.proofChain.contradiction = document.getElementById("l7-contradiction").value;
            state.l7.proofChain.clue = document.getElementById("l7-clue").value;
            saveGame(true);
            renderApp();
          });
        }
      });

      document.querySelectorAll("[data-l7-accuse]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.l7.accusedSuspectId = btn.dataset.l7Accuse;
          SoundEngine.pageTurn();
          saveGame(true);
          renderApp();
        });
      });

      document.getElementById("l7-submit-accusation")?.addEventListener("click", () => {
        const p = state.l7.proofChain;
        const validChain =
          p.motive === "scholarship_breach" &&
          p.opportunity === "av_console_edit" &&
          p.contradiction === "clock_offset_vs_alibi" &&
          p.clue === "audit_and_sync_logs";

        if (state.l7.accusedSuspectId === "tara" && validChain) {
          state.l7.feedbackMsg = "";
          completeLevelAndAdvance(7, 180, "Final Revelation (Tara Sen proven guilty with complete 4-part chain of evidence)");
        } else {
          state.wrongAccusations += 1;
          state.score = Math.max(0, state.score - 30);
          const chosen = CHARACTERS.find(c => c.id === state.l7.accusedSuspectId);
          state.l7.feedbackMsg =
            state.l7.accusedSuspectId !== "tara"
              ? `${chosen ? chosen.name : "That suspect"} has an explanation or alibi that doesn't match the clock-sync edit and scholarship audit trail. Re-examine your evidence and try again.`
              : "Your suspect choice is on track, but one or more links in your four-part proof chain don't match the verified evidence yet. Adjust your chain and try again.";
          SoundEngine.thunder();
          saveGame(true);
          renderApp();
        }
      });
    }

    /* =======================================================================
       LEVEL 8 – THE LAST SECRET (CONFRONTATION, BREAKDOWN, EPILOGUE & CERT)
       ======================================================================= */
    function renderLevel8() {
      const step = state.l8.confrontationStep;
      const tara = CHARACTERS.find(c => c.id === "tara");
      const diffMult = STORY_BIBLE.difficulties[state.difficulty]?.scoreMultiplier || 1;
      const finalScore = Math.round(state.score * diffMult);
      const rank =
        finalScore >= 750 ? "Master Hillcrest Sleuth" :
        finalScore >= 520 ? "Senior Academy Investigator" :
        "Junior Detective of St. Jude";

      const steps = [
        {
          title: "Step 1: Initial Denial",
          speech: "“Me? A murderer? You're letting stress run away with you, Detective. I helped check the logs—why would I sabotage anything?”"
        },
        {
          title: "Step 2: Cornered by the Clock & Audit Trail",
          speech: "“You... you traced the +35-minute clock-sync edit back to the AV terminal? And you found Ms. Eleanor's note on the scholarship endowment leak?”"
        },
        {
          title: "Step 3: The Full Truth & Clue Curation",
          speech: "“Ms. Eleanor was going to report the scholarship data leak before the festival awards. If that broke, my scholarship and my family's firm would be ruined. So I slipped monkshood extract into her tea, staged the fall, shifted the clock log, and nudged everyone toward murals and herbs so nobody would look at the audit files until too late...”"
        }
      ];

      const curStep = steps[Math.min(step, steps.length - 1)];

      return `
        <div style="display:flex;flex-direction:column;gap:1.25rem;">
          <div class="dialogue-box">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
              <span class="chapter-kicker">Final Confrontation — ${escapeHtml(curStep.title)}</span>
              <span style="font-size:0.78rem;color:var(--gold);">Culprit Exposed: Tara Sen (The Tech Expert)</span>
            </div>
            <div class="dialogue-top">
              ${renderPortraitSVG(tara.id, "large")}
              <div style="flex:1;min-width:220px;">
                <h3 style="color:var(--gold-light);font-size:1.15rem;">${escapeHtml(tara.name)} (${tara.age})</h3>
                <div style="font-size:0.8rem;color:#fca5a5;">${escapeHtml(tara.archetype)} • Secret Antagonist</div>
              </div>
            </div>
            <div class="dialogue-speech">“${escapeHtml(curStep.speech)}”</div>
            <div style="display:flex;flex-wrap:wrap;gap:0.6rem;">
              ${step < 2 ? `
                <button class="btn-primary" id="l8-next-confrontation">Present Irrefutable Evidence →</button>
              ` : `
                <span style="font-size:0.85rem;color:#4ade80;font-weight:600;">✓ Full confession & evidence breakdown unlocked below.</span>
              `}
            </div>
          </div>

          ${step >= 2 ? `
            <div class="panel-card" style="padding:1.2rem;">
              <h3 style="color:var(--gold-light);font-size:1.1rem;margin-bottom:0.75rem;">Complete Case Breakdown & Red Herrings</h3>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0.9rem;font-size:0.86rem;">
                <div class="panel-card" style="padding:0.9rem;background:var(--bg-navy);">
                  <h4 style="color:var(--gold);margin-bottom:0.35rem;">Motive & Method</h4>
                  <p>${escapeHtml(STORY_BIBLE.motiveSummary)} ${escapeHtml(STORY_BIBLE.methodSummary)}</p>
                </div>
                <div class="panel-card" style="padding:0.9rem;background:var(--bg-navy);">
                  <h4 style="color:var(--gold);margin-bottom:0.35rem;">Twist Within the Twist</h4>
                  <p>${escapeHtml(STORY_BIBLE.twistWithinTwist)}</p>
                </div>
                <div class="panel-card" style="padding:0.9rem;background:var(--bg-navy);">
                  <h4 style="color:var(--gold);margin-bottom:0.35rem;">Red Herrings & False Trail</h4>
                  <p>Riya's mural argument & brass key, Meera's botany experiments, Kavya's essay citations, and the doctored photo framing Nandini were distractions—not the murder plot.</p>
                </div>
              </div>
            </div>

            <div class="panel-card" style="padding:1.2rem;">
              <h3 style="color:var(--gold-light);font-size:1.1rem;margin-bottom:0.75rem;">Epilogue — All Eight Girls of St. Jude Hillcrest</h3>
              <div class="suspects-grid">
                ${CHARACTERS.map(c => {
                  const epilogueText = c.isGuilty
                    ? "Faces full academy and board accountability for tampering with records and causing Ms. Eleanor's death, while the scholarship audit is restored transparently."
                    : `Honored for helping piece together the truth after the shock; ${c.name.split(" ")[0]} moves forward into the Autumn Cultural Festival with her secret no longer a weapon against her.`;
                  return `
                    <div class="suspect-card">
                      <div class="suspect-header">
                        ${renderPortraitSVG(c.id)}
                        <div>
                          <div style="font-weight:700;font-size:0.88rem;color:var(--gold-light);">${escapeHtml(c.name)}</div>
                          <div style="font-size:0.72rem;color:${c.isGuilty ? "#fca5a5" : "#86efac"};">${c.isGuilty ? "Exposed Culprit" : "Cleared Friend"}</div>
                        </div>
                      </div>
                      <p style="font-size:0.8rem;color:var(--text-muted);">${escapeHtml(epilogueText)}</p>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="certificate-box printable-cert">
              <div style="font-size:0.78rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);">St. Jude Hillcrest Academy • Mystery Archive</div>
              <h3 style="font-size:1.65rem;color:var(--gold-light);margin-top:0.35rem;">Certificate of Detective Achievement</h3>
              <p style="margin-top:0.65rem;font-size:0.95rem;">Awarded to</p>
              <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:#fff;margin:0.25rem 0;">${escapeHtml(state.playerName)}</div>
              <p style="font-size:0.9rem;color:var(--gold);">Rank: <strong>${escapeHtml(rank)}</strong></p>
              <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:1.2rem;margin-top:1rem;font-size:0.86rem;">
                <span>Final Score: <strong>${finalScore}</strong></span>
                <span>Clues Found: <strong>${state.evidenceIds.length}/${EVIDENCE_CATALOG.length}</strong></span>
                <span>Hints Used: <strong>${state.hintsUsed}</strong></span>
                <span>Wrong Accusations: <strong>${state.wrongAccusations}</strong></span>
              </div>
              <div style="margin-top:1.35rem;display:flex;flex-wrap:wrap;justify-content:center;gap:0.65rem;">
                <button class="btn-gold" id="l8-print-btn">Print / Save Certificate</button>
                <button class="btn-secondary" id="l8-replay-btn">Play Again</button>
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function bindLevel8() {
      document.getElementById("l8-next-confrontation")?.addEventListener("click", () => {
        state.l8.confrontationStep = Math.min(2, state.l8.confrontationStep + 1);
        SoundEngine.dramaSwell();
        if (state.l8.confrontationStep === 2 && !state.completedLevels.includes(8)) {
          state.completedLevels.push(8);
          state.score += 150;
        }
        saveGame(true);
        renderApp();
      });

      document.getElementById("l8-print-btn")?.addEventListener("click", () => window.print());
      document.getElementById("l8-replay-btn")?.addEventListener("click", resetGame);
    }

    function renderLevelContent(lv) {
      switch (lv) {
        case 1: return renderLevel1();
        case 2: return renderLevel2();
        case 3: return renderLevel3();
        case 4: return renderLevel4();
        case 5: return renderLevel5();
        case 6: return renderLevel6();
        case 7: return renderLevel7();
        case 8: return renderLevel8();
        default: return renderLevel1();
      }
    }

    function bindLevelListeners(lv) {
      switch (lv) {
        case 1: bindLevel1(); break;
        case 2: bindLevel2(); break;
        case 3: bindLevel3(); break;
        case 4: bindLevel4(); break;
        case 5: bindLevel5(); break;
        case 6: bindLevel6(); break;
        case 7: bindLevel7(); break;
        case 8: bindLevel8(); break;
      }
    }

    /* =======================================================================
       8. INITIALIZATION
       ======================================================================= */
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
    });
  </script>
</body>
</html>
